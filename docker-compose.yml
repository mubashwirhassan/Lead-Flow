services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/leadflow_crm
    ports:
      - "3000:3000"
    depends_on:
      - mongo

volumes:
  mongo-data:
